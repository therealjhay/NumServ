services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: numserve
      POSTGRES_USER: numserve
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning

volumes:
  postgres_data:
